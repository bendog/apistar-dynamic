version: '3'

services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
        - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
        - db

  db:
    image: postgres:9.6
    env_file:
        - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
    pgdata:
